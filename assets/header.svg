<svg width="100%" height="100%" viewBox="0 0 850 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="850" height="200" rx="16" fill="url(#headerGrad)" />

  <!-- Flowing Fluid Wave Layers -->
  <path d="M0 130 C 200 80, 450 180, 850 110 L 850 200 L 0 200 Z" fill="url(#waveGrad1)" />
  <path d="M0 155 C 300 110, 550 190, 850 135 L 850 200 L 0 200 Z" fill="url(#waveGrad2)" />

  <!-- Modern Grid Dots Accents -->
  <g opacity="0.2">
    <circle cx="60" cy="45" r="2.5" fill="#FFFFFF" />
    <circle cx="80" cy="45" r="2.5" fill="#FFFFFF" />
    <circle cx="100" cy="45" r="2.5" fill="#FFFFFF" />
    <circle cx="60" cy="65" r="2.5" fill="#FFFFFF" />
    <circle cx="80" cy="65" r="2.5" fill="#FFFFFF" />
    <circle cx="100" cy="65" r="2.5" fill="#FFFFFF" />

    <circle cx="750" cy="135" r="2.5" fill="#FFFFFF" />
    <circle cx="770" cy="135" r="2.5" fill="#FFFFFF" />
    <circle cx="790" cy="135" r="2.5" fill="#FFFFFF" />
    <circle cx="750" cy="155" r="2.5" fill="#FFFFFF" />
    <circle cx="770" cy="155" r="2.5" fill="#FFFFFF" />
    <circle cx="790" cy="155" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Title & Subtitle Typography -->
  <text x="50%" y="90" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    Rohit M Naik
  </text>

  <text x="50%" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#F0F5FF" letter-spacing="2.5">
    FULL STACK DEVELOPER
  </text>
</svg>
